services:
  api-prepaga:
    build: .
    image: api-prepaga:1.0
    container_name: api-prepaga
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URL=mongodb://db-mongo:27017/arq_web
    depends_on:
      - db-mongo

  db-mongo:
    image: mongo:7
    container_name: db-mongo
    ports:
      - "27018:27017"